name: fw-artifact

on:
  pull_request:
    paths:
      - 'firmware/**'
      - 'tools/**'
      - 'VERSION'
      - '.github/workflows/fw-artifact.yml'
  workflow_dispatch:

jobs:
  esp32-s3-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build ESP32-S3 firmware with ESP-IDF v5.5.5
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32s3
          path: firmware/esp32-s3
      - name: Assemble ESP32 flash bundle
        shell: bash
        run: |
          set -euo pipefail
          SRC=firmware/esp32-s3/build
          DST=dist/esp32-s3
          mkdir -p "$DST/bootloader" "$DST/partition_table"
          cp "$SRC/bootloader/bootloader.bin" "$DST/bootloader/"
          cp "$SRC/partition_table/partition-table.bin" "$DST/partition_table/"
          find "$SRC" -maxdepth 1 -type f -name '*.bin' -exec cp {} "$DST/" \;
          if [ -f "$SRC/flash_args" ]; then
            cp "$SRC/flash_args" "$DST/flash_args_legacy"
            sed -e 's/--flash_mode/--flash-mode/g' -e 's/--flash_freq/--flash-freq/g' -e 's/--flash_size/--flash-size/g' "$SRC/flash_args" > "$DST/flash_args"
          fi
          cp tools/flash.ps1 tools/flash.sh "$DST/"
          chmod +x "$DST/flash.sh"
          if [ -f "$SRC/flasher_args.json" ]; then cp "$SRC/flasher_args.json" "$DST/"; fi
          if [ -f "$SRC/project_description.json" ]; then cp "$SRC/project_description.json" "$DST/"; fi
          cp VERSION "$DST/VERSION"
          git rev-parse HEAD > "$DST/GIT_SHA"
          printf '%s\n' 'SP01 FIELD PROTOTYPE SHADOW' > "$DST/PROTOTYPE_MODE.txt"
          printf '%s\n' 'Dummy WeightSnapshot enabled; normal process DO held safe OFF; real TLB485 deferred.' >> "$DST/PROTOTYPE_MODE.txt"
      - name: Upload ESP32 flash bundle
        uses: actions/upload-artifact@v4
        with:
          name: sp01-field-prototype
          path: dist/esp32-s3
          if-no-files-found: error
          retention-days: 14
