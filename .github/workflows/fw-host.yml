name: fw

on:
  workflow_dispatch:
  push:
    branches: [main, fw-sp01-v0.1, 'diag/**']
    paths:
      - 'firmware/**'
      - 'VERSION'
      - 'docs/ONBOARDING.md'
      - 'docs/INSTALL_ESP_IDF.md'
      - 'docs/BOARD_TERMINALS.md'
      - 'docs/assets/BOARD_TERMINALS.svg'
      - 'docs/FIRST_BOARD_CHECKLIST.md'
      - '.github/workflows/fw-host.yml'
  pull_request:
    paths:
      - 'firmware/**'
      - 'VERSION'
      - 'docs/ONBOARDING.md'
      - 'docs/INSTALL_ESP_IDF.md'
      - 'docs/BOARD_TERMINALS.md'
      - 'docs/assets/BOARD_TERMINALS.svg'
      - 'docs/FIRST_BOARD_CHECKLIST.md'
      - '.github/workflows/fw-host.yml'

permissions:
  contents: read

jobs:
  linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure host simulator
        run: cmake -S firmware/host -B build/host -DCMAKE_BUILD_TYPE=Release
      - name: Build host simulator
        run: cmake --build build/host --parallel
      - name: Test shared controller core
        run: ctest --test-dir build/host --output-on-failure
      - name: Host smoke
        run: ./build/host/sp01_host
      - name: Upload Linux host binary
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: sp01-host-linux-amd64-${{ github.sha }}
          path: build/host/sp01_host
          if-no-files-found: error
          retention-days: 14

  esp32-s3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP32-S3 firmware with ESP-IDF v5.5.5
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32s3
          path: firmware/esp32-s3

      - name: Assemble ESP32 flash bundle
        shell: bash
        run: |
          set -euo pipefail
          SRC=firmware/esp32-s3/build
          DST=dist/esp32-s3

          mkdir -p "$DST/bootloader" "$DST/partition_table" "$DST/assets"
          cp "$SRC/bootloader/bootloader.bin" "$DST/bootloader/"
          cp "$SRC/partition_table/partition-table.bin" "$DST/partition_table/"
          find "$SRC" -maxdepth 1 -type f -name '*.bin' -exec cp {} "$DST/" \;

          if [ -f "$SRC/flash_args" ]; then cp "$SRC/flash_args" "$DST/"; fi
          if [ -f "$SRC/flasher_args.json" ]; then cp "$SRC/flasher_args.json" "$DST/"; fi
          if [ -f "$SRC/project_description.json" ]; then cp "$SRC/project_description.json" "$DST/"; fi

          cp VERSION "$DST/VERSION"
          cp docs/ONBOARDING.md "$DST/ONBOARDING.md"
          cp docs/INSTALL_ESP_IDF.md "$DST/INSTALL_ESP_IDF.md"
          cp docs/BOARD_TERMINALS.md "$DST/BOARD_TERMINALS.md"
          cp docs/assets/BOARD_TERMINALS.svg "$DST/assets/BOARD_TERMINALS.svg"
          cp docs/FIRST_BOARD_CHECKLIST.md "$DST/FIRST_BOARD_CHECKLIST.md"
          printf '%s\n' "$GITHUB_SHA" > "$DST/GIT_SHA"
          printf '%s\n' 'ESP32-S3 / ESP-IDF v5.5.5 GitHub Actions build.' > "$DST/BUILD_INFO.txt"
          printf '%s\n' 'START WITH ONBOARDING.md. Developers: see INSTALL_ESP_IDF.md. Machine actuators must remain disconnected for first flash/G1.' >> "$DST/BUILD_INFO.txt"

          echo 'Flash bundle:'
          find "$DST" -maxdepth 2 -type f -print | sort

      - name: Upload ESP32 flash bundle
        uses: actions/upload-artifact@v4
        with:
          name: sp01-esp32-s3-${{ github.sha }}
          path: dist/esp32-s3
          if-no-files-found: error
          retention-days: 30
