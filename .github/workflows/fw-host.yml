name: fw

on:
  push:
    branches: [fw-sp01-v0.1]
    paths:
      - 'firmware/**'
      - '.github/workflows/fw-host.yml'
  pull_request:
    paths:
      - 'firmware/**'
      - '.github/workflows/fw-host.yml'

jobs:
  linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure host simulator
        run: cmake -S firmware/host -B build/host -DCMAKE_BUILD_TYPE=Release
      - name: Build host simulator
        run: cmake --build build/host --parallel
      - name: Test shared controller core
        run: ctest --test-dir build/host --output-on-failure
      - name: Host smoke
        run: ./build/host/sp01_host

  esp32-s3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP32-S3 firmware with ESP-IDF v5.5.5
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32s3
          path: firmware/esp32-s3
