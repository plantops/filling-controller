[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "filling-controller"
version = "0.1.0"
description = "Portable digital-twin-first industrial bag filling controller reference runtime"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]==0.141.1",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
filling-controller = "filling_controller.api:main"

[tool.hatch.build.targets.wheel]
packages = ["src/filling_controller"]

[tool.pytest.ini_options]
pythonpath = ["src"]
