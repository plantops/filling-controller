<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SP01 DEV HMI</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0e1114;color:#e8edf2;font-family:system-ui}.wrap{max-width:1280px;margin:auto;padding:14px}.head,.strip{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.head{justify-content:space-between}.pill{border:1px solid #39434c;border-radius:999px;padding:6px 10px;background:#171c21}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:10px}.card{background:#151a1f;border:1px solid #343d45;border-radius:10px;padding:12px}.card h3{margin:0 0 8px;font-size:14px}.row{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid #252c32}.lamp{min-width:58px;text-align:center;border-radius:5px;padding:3px 6px;background:#252b31;font-size:12px}.on{background:#205b37}.warn{background:#6c5220}.bad{background:#6d2525}.flow{display:flex;gap:5px;overflow:auto;margin-top:10px}.st{border:1px solid #39434b;border-radius:6px;padding:6px;font-size:11px;opacity:.45;white-space:nowrap}.st.active{opacity:1;background:#183149}.mono{font-family:ui-monospace,monospace}.small{font-size:12px;opacity:.7}a{color:#9fc7ff}@media(max-width:900px){.grid3{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="head"><div><h2>SP01 DEV HMI</h2><div id="conn" class="small">Connecting</div></div><a href="/">OP MODE</a></div><div class="strip"><span id="mode" class="pill">Mode -</span><span id="state" class="pill">State -</span><span id="cycle" class="pill">Cycle -</span><span id="bag" class="pill">Bag -</span><span id="weight" class="pill">Weight -</span><span id="quality" class="pill">Quality -</span></div><div class="grid3"><div class="card"><h3>INPUTS ACTUAL</h3><div id="di"></div></div><div class="card"><h3>CONTROLLER CORE</h3><div id="core"></div></div><div class="card"><h3>OUTPUTS</h3><div id="do"></div></div></div><div class="card" style="margin-top:10px"><h3>STATE FLOW</h3><div id="flow" class="flow"></div></div></div><script>const D=['feeder_running','downstream_ready','machine_motor_running','initiative','fill_position','bag_present','position_index','position_mark'];const O=['scanner.down','bag_detect_air','bag.push','dosing.valve_a','dosing.valve_b','dosing.valve_c','filling.motor','spout.aeration'];const S=['WAIT_PERMISSIVE','WAIT_FILL_POSITION','BAG_ACQUIRE','BAG_VERIFY','TARE_READY','COARSE_FILL','FINE_FILL','CUTOFF','SETTLE','REJECT_WAIT','WAIT_DISCHARGE','PUSH','COMPLETE','FAULT'];const row=(n,v,c='')=>`<div class=row><span>${n}</span><span class="lamp ${c}">${v}</span></div>`;function lamps(a,n){return n.map((x,i)=>row(x,a[i]?'ON':'OFF',a[i]?'on':'' )).join('')}async function poll(){try{const s=await(await fetch('/api/dev',{cache:'no-store'})).json();conn.textContent='LIVE '+s.fw;mode.textContent='Mode '+s.runtime_mode;state.textContent='State '+s.state;cycle.textContent='Cycle '+s.cycle_id;bag.textContent='Bag '+s.disposition;weight.textContent='Weight '+s.weight.net_kg.toFixed(2)+' kg';quality.textContent='Quality '+s.weight.quality+(s.weight.fresh?' / FRESH':' / STALE');di.innerHTML=lamps(s.di_actual,D);core.innerHTML=row('ready',s.core.ready?'YES':'NO',s.core.ready?'on':'warn')+row('fault',s.fault,s.fault==='NONE'?'':'bad')+row('position',s.position.valid?s.position.angle_deg.toFixed(1)+' deg':'INVALID',s.position.valid?'on':'warn')+row('blocked_by',s.core.blocks.length?s.core.blocks.map(x=>x.id).join(', '):'NONE',s.core.blocks.length?'warn':'on');let h='';for(let i=0;i<8;i++)h+=`<div class=row><span>${O[i]}</span><span><span class="lamp ${s.desired_do[i]?'on':''}">DES ${s.desired_do[i]?'ON':'OFF'}</span> <span class="lamp ${s.commanded_do[i]?'on':''}">CMD ${s.commanded_do[i]?'ON':'OFF'}</span></span></div>`;do.innerHTML=h;flow.innerHTML=S.map(x=>`<span class="st ${x===s.state?'active':''}">${x}</span>`).join('')}catch(e){conn.textContent='OFFLINE'}setTimeout(poll,300)}poll()</script></body></html>
