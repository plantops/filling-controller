<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SP01 DEV</title>
<style>
:root{--bg:#eceef0;--panel:#fff;--line:#d3d7db;--ink:#1c2024;--ink2:#5c646c;--ink3:#868e96;--warn:#b26a00;--warnbg:#fdf3e3;--bad:#a52020;--badbg:#fbeceb;--live:#0a5ca8;--r:10px}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}.wrap{max-width:1180px;margin:0 auto;padding:14px}.idbar,.card,.ctx{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}.idbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 16px}.mach{font-size:26px;font-weight:700;line-height:1}.mach small,.cap{display:block;font-size:11px;font-weight:600;color:var(--ink3);letter-spacing:.09em;text-transform:uppercase;margin-bottom:4px}.grow{flex:1}.state{font-size:15px;font-weight:600;color:var(--ink2)}.conn{font-size:12px;color:var(--ink3)}.conn.off{color:var(--bad);font-weight:600}.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;padding:8px 13px;font:inherit;font-size:13px;font-weight:600;text-decoration:none}.ctx{display:flex;gap:14px;flex-wrap:wrap;align-items:center;padding:10px 16px;margin-top:12px;font-size:13px;color:var(--ink2)}.ctx b{color:var(--ink)}.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:12px}.card{padding:16px 18px}.row{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid #edf0f2;font-size:13px}.row:last-child{border:0}.lamp{min-width:64px;text-align:center;border:1px solid var(--line);border-radius:7px;padding:3px 7px;color:var(--ink2);font-size:12px;font-weight:600}.lamp.on{border-color:var(--live);color:var(--live);background:#eef4fb}.lamp.warn{border-color:#e8c98d;color:var(--warn);background:var(--warnbg)}.lamp.bad{border-color:#e8b3b0;color:var(--bad);background:var(--badbg)}.flow{display:flex;gap:6px;overflow:auto}.st{border:1px solid var(--line);border-radius:7px;padding:6px 8px;font-size:11px;color:var(--ink3);white-space:nowrap}.st.active{background:var(--ink);border-color:var(--ink);color:#fff}.timeline{height:150px;overflow:auto;font:12px ui-monospace,monospace}.ev{display:grid;grid-template-columns:82px 110px 1fr;gap:8px;padding:5px 0;border-bottom:1px solid #edf0f2}.ev b{font-weight:600}.muted{color:var(--ink3)}.shadow{color:var(--warn);font-weight:700}footer{color:var(--ink3);font-size:11px;text-align:center;padding:18px 0 8px}@media(min-width:720px){.wrap{padding:18px}}@media(max-width:900px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<div class="idbar"><div class="mach"><small>Máy · Vòi · DEV</small><span>SP01</span></div><div class="grow"></div><div><div class="state" id="state">—</div><div class="conn" id="conn">Connecting</div></div><a class="btn" href="/">OP MODE</a></div>
<div class="ctx"><span>Mode <b id="mode">—</b></span><span>Cycle <b id="cycle">—</b></span><span>Bag <b id="bag">—</b></span><span>Weight <b id="weight">—</b></span><span id="shadow" class="shadow"></span></div>
<div class="grid"><div class="card"><span class="cap">Inputs actual</span><div id="di"></div></div><div class="card"><span class="cap">Controller core</span><div id="core"></div></div><div class="card"><span class="cap">Outputs · desired / commanded</span><div id="do"></div></div></div>
<div class="card" style="margin-top:12px"><span class="cap">State flow</span><div id="flow" class="flow"></div></div>
<div class="card" style="margin-top:12px"><span class="cap">Event timeline · browser session</span><div id="timeline" class="timeline"><div class="muted">Waiting for changes…</div></div></div>
<footer id="foot">SP01 DEV</footer></div>
<script>
const D=['feeder_running','downstream_ready','machine_motor_running','initiative','fill_position','bag_present','position_index','position_mark'],O=['scanner.down','bag_detect_air','bag.push','dosing.valve_a','dosing.valve_b','dosing.valve_c','filling.motor','spout.aeration'],S=['WAIT_PERMISSIVE','WAIT_FILL_POSITION','BAG_ACQUIRE','BAG_VERIFY','TARE_READY','COARSE_FILL','FINE_FILL','CUTOFF','SETTLE','REJECT_WAIT','WAIT_DISCHARGE','PUSH','COMPLETE','FAULT'];let prev=null,events=[];const row=(n,v,c='')=>`<div class="row"><span>${n}</span><span class="lamp ${c}">${v}</span></div>`,lamps=(a,n)=>n.map((x,i)=>row(x,a[i]?'ON':'OFF',a[i]?'on':'')).join('');function add(t,v){events.unshift({t:new Date().toLocaleTimeString(),k:t,v});events=events.slice(0,80);timeline.innerHTML=events.map(e=>`<div class="ev"><span class="muted">${e.t}</span><b>${e.k}</b><span>${e.v}</span></div>`).join('')}function changes(s){if(!prev){add('BOOT VIEW',s.state);prev=s;return}if(s.state!==prev.state)add('STATE',prev.state+' → '+s.state);if(s.fault!==prev.fault)add('FAULT',prev.fault+' → '+s.fault);for(let i=0;i<8;i++){if(s.di_actual[i]!==prev.di_actual[i])add('DI'+(i+1),s.di_actual[i]?'ON':'OFF');if(s.commanded_do[i]!==prev.commanded_do[i])add('DO'+(i+1),s.commanded_do[i]?'ON':'OFF')}prev=s}async function poll(){try{const s=await(await fetch('/api/dev',{cache:'no-store'})).json();changes(s);conn.textContent='Trực tuyến · '+s.fw;conn.className='conn';state.textContent=s.state;mode.textContent=s.runtime_mode;cycle.textContent=s.cycle_id;bag.textContent=s.disposition;weight.textContent=s.weight.net_kg.toFixed(2)+' kg · '+s.weight.quality+(s.weight.fresh?' · FRESH':' · STALE');shadow.textContent=s.shadow_mode?'SHADOW · physical process DO suppressed':'';di.innerHTML=lamps(s.di_actual,D);core.innerHTML=row('ready',s.core.ready?'YES':'NO',s.core.ready?'on':'warn')+row('fault',s.fault,s.fault==='NONE'?'':'bad')+row('position',s.position.valid?s.position.angle_deg.toFixed(1)+'°':'INVALID',s.position.valid?'on':'warn')+row('blocked_by',s.core.blocks.length?s.core.blocks.map(x=>x.id).join(', '):'NONE',s.core.blocks.length?'warn':'on');let h='';for(let i=0;i<8;i++)h+=`<div class="row"><span>${O[i]}</span><span><span class="lamp ${s.desired_do[i]?'on':''}">DES ${s.desired_do[i]?'ON':'OFF'}</span> <span class="lamp ${s.commanded_do[i]?'on':''}">CMD ${s.commanded_do[i]?'ON':'OFF'}</span></span></div>`;do.innerHTML=h;flow.innerHTML=S.map(x=>`<span class="st ${x===s.state?'active':''}">${x}</span>`).join('');foot.textContent='SP01 DEV · '+s.fw}catch(e){conn.textContent='MẤT KẾT NỐI';conn.className='conn off'}setTimeout(poll,300)}poll()
</script></body></html>
